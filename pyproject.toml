description = "Flask REST API and MCP server for TestCustomer SQL Server CRUD"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "pyodbc",
    "mcp[cli]>=2.0.0",
    "openai-agents>=0.24.0",
    "fastapi>=0.148.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.4",
    "python-dotenv>=1.2.3",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
]
